version: '3.8'

services:
  frontend:
    build:
      context: ../
      dockerfile: ./apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BFF_URL=http://bff:4000
    depends_on:
      - bff
    restart: unless-stopped

  bff:
    build:
      context: ../
      dockerfile: ./apps/bff/Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://saju_user:saju_password@db:5432/saju
      - CORS_ORIGIN=http://frontend:3000
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=saju
      - POSTGRES_USER=saju_user
      - POSTGRES_PASSWORD=saju_password
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - bff
    restart: unless-stopped

volumes:
  postgres_data:
